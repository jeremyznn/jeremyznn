name: Profile // Stable Live Build

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/**"
      - ".github/workflows/profile-live.yml"

permissions:
  contents: write

concurrency:
  group: profile-live
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate responsive animated hero
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate_hero.py

      - name: Generate self-hosted GitHub cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.PROFILE_TOKEN || github.token }}
          username: ${{ github.repository_owner }}
          cards: overview,contributions,languages
          output-dir: assets/cards
          themes: light,dark
          commit: false

      - name: Generate 3D contribution world
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate GIF contribution stream
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_TOKEN || github.token }}
          outputs: |
            assets/generated/github-snake-dark.gif?palette=github-dark&color_snake=#B7A7FF&color_dots=#0D1117,#24213E,#4338CA,#7C3AED,#22D3EE&color_background=#0D1117
            assets/generated/github-snake-light.gif?palette=github-light&color_snake=#6D5DFC&color_dots=#FFFFFF,#E9E5FF,#C4B5FD,#8B5CF6,#22B8CF&color_background=#FFFFFF

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/generated assets/cards profile-3d-contrib

          if git diff --cached --quiet; then
            echo "Generated assets are already up to date."
            exit 0
          fi

          git commit -m "chore(profile): refresh generated assets [skip ci]"
          git push
