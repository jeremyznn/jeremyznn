name: Profile // Premium Live Build

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/**"
      - ".github/workflows/profile-live.yml"

permissions:
  contents: write

concurrency:
  group: profile-live
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Generate custom animated profile visuals
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/generate_profile_visuals.py

      - name: Render live GitHub profile cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.PROFILE_TOKEN || github.token }}
          username: ${{ github.repository_owner }}
          cards: overview,contributions,rhythm,composition
          output-dir: assets/cards
          themes: light,dark
          font: Inter
          mono-font: JetBrains Mono
          commit: false

      - name: Generate animated 3D contribution world
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate contribution stream
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_TOKEN || github.token }}
          outputs: |
            assets/generated/github-snake.svg?color_snake=#6D5DFC&color_dots=#F6F8FA,#DDD6FE,#A78BFA,#7C3AED,#22D3EE
            assets/generated/github-snake-dark.svg?palette=github-dark&color_snake=#B7A7FF&color_dots=#0D1117,#24213E,#4338CA,#7C3AED,#22D3EE

      - name: Commit generated profile assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated assets/cards profile-3d-contrib

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "chore(profile): refresh live profile [skip ci]"
          git push
