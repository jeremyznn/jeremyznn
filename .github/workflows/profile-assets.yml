name: Build GitHub profile assets

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/profile-assets.yml

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.svg
          token: ${{ secrets.PROFILE_TOKEN || github.token }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header
          config_timezone: Europe/Paris
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_threshold: 1%
          output_action: none

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_TOKEN || github.token }}
          outputs: |
            assets/github-snake.svg?color_snake=#4f46e5&color_dots=#f6f8fa,#c7d2fe,#818cf8,#6366f1,#4f46e5
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#0d1117,#312e81,#4f46e5,#7c3aed,#22d3ee

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets profile-3d-contrib

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "chore(profile): refresh generated assets"
          git push
